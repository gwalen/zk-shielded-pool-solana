[workspace]
members = [
    "programs/*"
]
resolver = "2"

[workspace.package]
edition = "2021"
# Matches the Anchor v2 stub / rust-toolchain pin so edition.workspace and
# rust-version.workspace inherit from here (not from a nested [workspace]).
rust-version = "1.89.0"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1