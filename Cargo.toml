[workspace]
members = [
    "programs/*"
]
resolver = "2"

[workspace.package]
edition = "2021"
# Matches the Anchor v2 stub / rust-toolchain pin so edition.workspace and
# rust-version.workspace inherit from here (not from a nested [workspace]).
rust-version = "1.89.0"

# Applies to building the zk_shielded_pool_solana.so
[profile.release]
opt-level = 3
overflow-checks = true
lto = "fat"
codegen-units = 1

# Anchor when compiling first builds the proc-macro create, this profile is used for building this binary.
# Later this proc-macro binary is used to expand macors (like #[program], #[derive(Accounts)])
# We use opt-level = 3 to make the proc-macro binary faster as it is optimized.
[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1

# This is optimize the performance of the development build, thanks to this poseidon_hash is much faster and 
# with tree depth 20 it takes ~17s (thanks to opt-level 3) vs over minute with opt-level = 0
# NOTE:
# opt-level = 3 rewrites the code so it runs faster. The compiler inlines functions, moves instructions, and drops locals it thinks are unused.
# TRADEOFF: it makes the code harder to debug (issues with breakpoints etc.)
[profile.dev]
opt-level = 3
debug = 1
overflow-checks = true
incremental = true

# TEMPORARY: local anchor-v2 fork (branch fix/idl-pod-wrapper-fields) so the IDL
# keeps Pod wrapper field types (PodU64, PodBool, ...). Remove once the fix is upstream.
[patch."https://github.com/otter-sec/anchor.git"]
anchor-lang = { path = "/Users/whale/development/workshop/crypto/solana/anchor-v2/lang-v2" }
anchor-derive-accounts = { path = "/Users/whale/development/workshop/crypto/solana/anchor-v2/lang-v2/derive" }
anchor-spl = { path = "/Users/whale/development/workshop/crypto/solana/anchor-v2/spl-v2" }
anchor-client = { path = "/Users/whale/development/workshop/crypto/solana/anchor-v2/client" }
anchor-lang-idl = { path = "/Users/whale/development/workshop/crypto/solana/anchor-v2/idl" }
anchor-lang-idl-spec = { path = "/Users/whale/development/workshop/crypto/solana/anchor-v2/idl/spec" }
anchor-v2-testing = { path = "/Users/whale/development/workshop/crypto/solana/anchor-v2/v2-testing" }
