[package]
name = "zk-shielded-pool-solana"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

# cargo-build-sbf sets cfg(target_os = "solana"); rustc 1.80+ warns unless we declare it.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }

[lib]
crate-type = ["cdylib", "lib"]

[features]
# alloc = []
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = []
profile = ["anchor-v2-testing/profile"]

[dependencies]
anchor-lang = { git = "https://github.com/otter-sec/anchor.git", branch = "anchor-next" }
anchor-spl = { git = "https://github.com/otter-sec/anchor.git", branch = "anchor-next" }
# Direct dep: #[derive(bytemuck::Pod)] on nested ImtTree; transitive bytemuck from anchor-lang is not enough.
# min_const_generics: Pod for every [T; N]. Default bytemuck only lists only some sizes where is N in (32, 48, 64, 96, 128, 256, 512, 1024, 2048, 4096)
bytemuck = { version = "1", features = ["derive", "min_const_generics"] }
solana-instruction = { version = "3.1.10" }
# We need raw syscall access for poseidon hash on-chain, can't use solana-poseidon crate because it is not no-std compatible
# Major 5 matches quasar-lang's own dependency
solana-define-syscall = "5"
solana-message = "3.0.1"
# Local no_std Halo2 BN254/GWC verifier only (crates/verifier). Does not pull
# the Halo2 prover / circuit / vk-host workspace members. default-features
# off keeps std/debug-trace out. solana-syscalls = solana-bn254 + raw
# sol_keccak256/sol_big_mod_exp via solana-define-syscall (no solana-program)
halo2-solana-verifier = { path = "../../../solana-proof-generator/crates/verifier", default-features = false, features = ["solana-syscalls"] }

# If target is no Solana (on-chain).
# For host (cargo test) tests we need solana-poseidon as no syscalls are available
[target.'cfg(not(target_os = "solana"))'.dependencies]
# Because of config feature in the solana-poseidon crate (#[cfg(target_os = "solana")]) this is evaluates to syscall
# sol_poseidon on-chain (off-chain it would be light_poseidon + ark_bn254)
solana-poseidon = "4"
## solana-poseidon = { path = "/Users/whale/development/workshop/crypto/solana/solana-sdk/poseidon" } # for local testing


[dev-dependencies]
anchor-v2-testing = { git = "https://github.com/otter-sec/anchor.git", branch = "anchor-next" }
# Named so tests can match on TransactionMetadata.logs and FailedTransactionMetadata.err.
# Version follows whatever anchor-v2-testing currently pulls (0.13.x).
litesvm = "0.13"
# Host Keccak256. Same bytes as on-chain sol_keccak256. `sha3` is required off-chain; without it hash() panics.
solana-keccak-hasher = { version = "3.1", features = ["sha3"] }
# needed for testing
halo2-base = { version = "0.5.1", default-features = false, features = ["halo2-axiom", "display", "test-utils"] }
# Decode `emit!` logs in tests. Same git as `anchor-lang`.
anchor-client = { git = "https://github.com/otter-sec/anchor.git", branch = "anchor-next" }
# needed for testing
anyhow = "1.0.99"

